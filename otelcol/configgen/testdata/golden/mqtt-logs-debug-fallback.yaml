receivers:
    mqtt:
        broker: core-mosquitto
        port: 1883
        qos: 0
        client_id: otelcol-ha
        tls: false
        topics:
            - logs/#
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318
processors:
    batch: {}
    memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
exporters:
    debug:
        verbosity: basic
    prometheus/0:
        endpoint: 0.0.0.0:8889
extensions:
    pprof:
        endpoint: 127.0.0.1:1777
    zpages:
        endpoint: 127.0.0.1:55679
service:
    extensions: [health_check, pprof, zpages]
    pipelines:
        logs:
            receivers: [otlp, mqtt]
            processors: [memory_limiter, batch]
            exporters: [debug]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheus/0, debug]
        traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug]

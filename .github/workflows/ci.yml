name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: git fetch origin main
      - run: npx changeset status --since=origin/main

  version-sync:
    name: config.yaml matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert add-on version matches package.json
        run: |
          pkg=$(node -p "require('./otelcol/package.json').version")
          cfg=$(sed -n 's/^version:[[:space:]]*//p' otelcol/config.yaml | tr -d '"')
          [ "$pkg" = "$cfg" ] || { echo "version drift: package.json=$pkg config.yaml=$cfg" >&2; exit 1; }

  test:
    name: Go tests (mqttreceiver)
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: otelcol/components/mqttreceiver/go.mod
      - working-directory: otelcol/components/mqttreceiver
        run: go test ./...

  lint:
    name: Add-on linter
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./otelcol

  apparmor:
    name: AppArmor profile
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install AppArmor utilities
        run: sudo apt-get update && sudo apt-get install -y apparmor-utils
      - name: Validate profile syntax
        run: sudo apparmor_parser -Q otelcol/apparmor.txt

  e2e:
    name: E2E (mqtt + otlp)
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Resolve base image
        id: base
        run: |
          build_from=$(grep -E '^\s+amd64:' otelcol/build.yaml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$build_from" ] || { echo "could not read amd64 build_from from build.yaml" >&2; exit 1; }
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            go-mod-cache
            go-build-cache
          key: docker-go-${{ hashFiles('otelcol/builder-config.yaml', 'otelcol/components/**/go.sum') }}
          restore-keys: |
            docker-go-
      - name: Inject Go cache into buildx
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "go-mod-cache": "/go/pkg/mod",
              "go-build-cache": "/root/.cache/go-build"
            }
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: otelcol
          load: true
          tags: otelcol:e2e
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
            BUILD_ARCH=amd64
      - name: Install mosquitto-clients
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients
      - name: Run e2e suite
        run: otelcol/tests/e2e/run.sh

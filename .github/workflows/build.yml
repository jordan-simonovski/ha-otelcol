name: Build & publish

on:
  push:
    branches: [main]
    paths:
      - "otelcol/**"
      - ".github/workflows/build.yml"

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: otelcol

permissions:
  contents: read

jobs:
  init:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      version: ${{ steps.decide.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version and check for existing tag
        id: decide
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' otelcol/config.yaml | tr -d '"')
          [ -n "$version" ] || { echo "no version in otelcol/config.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged; nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        if: steps.decide.outputs.should_publish == 'true'
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    if: needs.init.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve base image
        id: base
        run: |
          build_from=$(grep -E "^\s+${{ matrix.arch }}:" otelcol/build.yaml | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$build_from" ] || { echo "could not read ${{ matrix.arch }} build_from from build.yaml" >&2; exit 1; }
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          context: otelcol
          push: "true"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
            BUILD_ARCH=${{ matrix.arch }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag and release
    needs: [init, manifest]
    if: needs.init.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --generate-notes
